			var data;
            function loadShare() {
                $.post("getShareNoteTitle", function(result, status) {
					result = JSON.parse(result);
					document.getElementById('share_note_title').innerHTML = result.data;
				});

				$.post("getShareNoteDescription", function(result, status) {
					result = JSON.parse(result);
					document.getElementById('share_note_description').innerHTML = result.data;
				});
            }
			function init() {
				if (getQueryString('type').length > 0) {
					$.post("get", {
						data: JSON.stringify({
							type: getQueryString('type')
						})
					}, function(result, status) {
						result = JSON.parse(result);
						data = result.data;
						createView(result.title, result.data, false);
						document.getElementById('note').style.display = 'none';
						loadShare();
					});
				} else {
					$.post("get", function(result, status) {
						result = JSON.parse(result);
						data = result.data;
						createView(result.title, result.data, true);
						document.getElementById('note').style.display = 'block';
						loadShare();
					});
				}

			}
            $(function () {
               init();
            });

			var item_open_template = '<a class="box" href="{url}" target="_blank"><img src="{thumb}" class="thumbnail" /><div><p>{filename}</p><font>{createtime}</font><span>{filesize}</span></div></a>';
			var item_download_template = '<a class="box" href="{url}" download="{filename}"><img src="{thumb}" class="thumbnail" /><div><p>{filename}</p><font>{createtime}</font><span>{filesize}</span></div></a>';

			function createView(title, data, home) {
				document.getElementById('content').innerHTML = '';
				var view = '<h3>' + title + '</h3><div class="category">';
				for (var i = 0; i < data.length; i++) {
					data[i].isselect = false;
					var thumbUrl = data[i].thumbnail;
					if (thumbUrl && thumbUrl.startsWith('./')) {
						thumbUrl = thumbUrl.substring(thumbUrl.indexOf('/') + 1);
					} else if (thumbUrl) {
						var tAuth = data[i].thumbauth || data[i].auth;
						thumbUrl = 'getfile?path=' + data[i].thumbnail + '&auth=' + tAuth;
					} 
					
					if (!thumbUrl || thumbUrl === 'imgs/unknown.png') {
						if (data[i].type == '0') thumbUrl = 'imgs/pic.png';
						else if (data[i].type == '1') thumbUrl = 'imgs/mov.png';
						else if (data[i].type == '2') thumbUrl = 'imgs/doc.png';
						else if (data[i].type == '3') thumbUrl = 'imgs/audio.png';
						else if (data[i].type == '4') thumbUrl = 'imgs/app.png';
						else if (data[i].type == '5') thumbUrl = 'imgs/zip.png';
						else thumbUrl = 'imgs/other.png';
					}

					var type =data[i].filesize == '0';
					if(type){
						view +=
							(item_open_template)
							.format({
								thumb: thumbUrl,
								url: data[i].url.startsWith('./') ? data[i].url : 'getfile?path=' + data[i].url + '&auth=' + data[i].auth,
								filename: data[i].filename,
								createtime: timeStamp2String(data[i].createtime),
								filesize: formatFileSize(data[i].filesize)
							});
					}else{
					view +=
							(item_download_template)
							.format({
								thumb: thumbUrl,
								url: data[i].url.startsWith('./') ? data[i].url : 'getfile?path=' + data[i].url + '&auth=' + data[i].auth,
								filename: data[i].filename,
								createtime: timeStamp2String(data[i].createtime),
								filesize: formatFileSize(data[i].filesize)
							});
					}
				}
				view += '</div>';
				document.getElementById('content').innerHTML += view;
			}

			function timeStamp2String(time) {
				var datetime = new Date();
				datetime.setTime(time);
				var year = datetime.getFullYear();
				var month = datetime.getMonth() + 1 < 10 ? "0" + (datetime.getMonth() + 1) : datetime.getMonth() + 1;
				var date = datetime.getDate() < 10 ? "0" + datetime.getDate() : datetime.getDate();
				var hour = datetime.getHours() < 10 ? "0" + datetime.getHours() : datetime.getHours();
				var minute = datetime.getMinutes() < 10 ? "0" + datetime.getMinutes() : datetime.getMinutes();
				var second = datetime.getSeconds() < 10 ? "0" + datetime.getSeconds() : datetime.getSeconds();
				return year + "-" + month + "-" + date + " " + hour + ":" + minute + ":" + second;
			}

			function formatFileSize(fileSize) {
				if (fileSize == 0 || fileSize == null) {
					return '';
				}
				if (fileSize < 1024) {
					return fileSize + 'B';
				} else if (fileSize < (1024 * 1024)) {
					var temp = fileSize / 1024;
					temp = temp.toFixed(2);
					return temp + 'KB';
				} else if (fileSize < (1024 * 1024 * 1024)) {
					var temp = fileSize / (1024 * 1024);
					temp = temp.toFixed(2);
					return temp + 'MB';
				} else {
					var temp = fileSize / (1024 * 1024 * 1024);
					temp = temp.toFixed(2);
					return temp + 'GB';
				}
			}

			function getQueryString(name) {
				var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
				var r = window.location.search.substr(1).match(reg);
				if (r != null)
					return decodeURIComponent(r[2]);
				return '';
			}
